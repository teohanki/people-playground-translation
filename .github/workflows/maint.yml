name: Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          mkdir -p docs
          git mv tools/docs/banner2.png docs/banner.png
          python3 - <<'EOF'
          p = 'README.md'
          s = open(p, encoding='utf-8').read()
          if 'docs/banner.png' not in s:
              s = '<p align="center"><img src="docs/banner.png" alt="PPG Translate: People Playground in 11 languages" width="100%"></p>\n\n' + s
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          git config user.name teohanki
          git config user.email 345032692+teohanki@users.noreply.github.com
          git add -A
          git commit -q -m "Add banner to README"
          git push
