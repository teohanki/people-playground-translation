name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "8fc9ce2cef8b5377c6e5daf75e9cbc46f3f38f586e8be3ef50813bca67ab6a11  import/people-playground-translation.txz" | sha256sum -c
          cp import/people-playground-translation.txz /tmp/b.txz
          git rm -q -r import README.md
          tar -xJf /tmp/b.txz -C .
          chmod +x tools/*.sh
          git add -A
          git update-index --chmod=+x tools/build.sh tools/package.sh tools/mkflags.sh
          git status --short | head -50
          git config user.name "teohanki"
          git config user.email "345032692+teohanki@users.noreply.github.com"
          git commit -q -m "PPG Translate 2.3.0"
          git push origin HEAD:main
